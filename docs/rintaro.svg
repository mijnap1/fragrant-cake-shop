<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 380" width="200" height="380" overflow="visible"><style>
.breathe { transform-box: view-box; transform-origin: 100px 380px; animation: breathe 3.6s ease-in-out infinite; }
.headbob { transform-box: view-box; transform-origin: 100px 140px; animation: headbob 3.6s ease-in-out infinite; }
.sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 4.2s ease-in-out infinite; }
.sway-alt { animation-delay: -2.1s; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.2s ease-in-out infinite; }
.drip { animation: drip 1.6s ease-in infinite; }
@keyframes breathe { 50% { transform: scale(1.01, 1.016); } }
@keyframes headbob { 50% { transform: translateY(1.5px) rotate(0.5deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes twinkle { 50% { transform: scale(0.6) rotate(20deg); opacity: 0.7; } }
@keyframes drip { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
