<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>향기로운 케이크 가게</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f48fb1;
    --pink-d: #e0688f;
    --pink-l: #ffe4ec;
    --cream: #fffaf5;
    --ink: #5a3e45;
    --ink-soft: #9a7880;
    --gold: #e0a93b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%; overflow: hidden;
    background: #ffeef3; color: var(--ink);
    font-family: 'Gowun Dodum', sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; transition: opacity .35s ease; }
  #bg.fade { opacity: 0; }
  #bg svg { width: 100%; height: 100%; display: block; }
  #clickLayer { position: absolute; inset: 0; }

  /* ---------- characters ---------- */
  #chars { position: absolute; inset: 0; pointer-events: none; }
  .char {
    position: absolute; bottom: 0; transform: translateX(-50%);
    transition: left .5s ease, filter .3s ease, opacity .35s ease;
  }
  .char svg { height: 100%; width: auto; display: block; filter: drop-shadow(0 8px 14px rgba(150, 70, 95, .18)); }
  .char.rin { height: min(78vh, 105vw); }
  .char.kao { height: min(69vh, 93vw); }
  .pos-left { left: 27%; } .pos-center { left: 50%; } .pos-right { left: 73%; }
  .char.dim { filter: brightness(.86) saturate(.85); }
  .char.out { opacity: 0; }
  .char.enter { animation: charIn .45s ease; }
  .char.hop svg { animation: hop .35s ease; }
  @keyframes charIn { from { opacity: 0; transform: translate(-50%, 24px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes hop { 40% { transform: translateY(-14px); } }

  /* ---------- dialogue box ---------- */
  #box {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom));
    width: min(920px, calc(100% - 32px)); min-height: 150px;
    background: rgba(255, 253, 250, .95);
    border: 3px solid #ffc7d6; border-radius: 26px;
    box-shadow: 0 12px 30px rgba(224, 104, 143, .22), inset 0 0 0 6px #fff;
    padding: 30px 30px 24px; cursor: pointer; z-index: 5;
  }
  #box::before, #box::after {
    content: '✿'; position: absolute; color: #ffc7d6; font-size: 20px;
  }
  #box::before { top: 8px; right: 16px; }
  #box::after { bottom: 6px; left: 14px; font-size: 14px; }
  #nameTag {
    position: absolute; top: -20px; left: 26px;
    padding: 6px 20px; border-radius: 999px;
    font-family: 'Jua'; font-size: 20px; color: #fff; background: var(--pink);
    border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0, 0, 0, .08);
  }
  #text {
    font-size: clamp(16px, 2.1vw, 20px); line-height: 1.75;
    min-height: 3.5em; white-space: pre-wrap; word-break: keep-all;
  }
  #text.narr { color: var(--ink-soft); }
  #next { position: absolute; right: 24px; bottom: 14px; color: var(--pink); font-size: 14px; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(4px); } }

  /* ---------- choices ---------- */
  #choices {
    position: absolute; left: 0; right: 0; top: 64px; bottom: 200px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 0 16px; z-index: 6;
  }
  .choice {
    width: min(560px, 100%); padding: 16px 26px;
    font-weight: 700; font-size: clamp(15px, 2vw, 18px); color: var(--ink);
    border-radius: 999px; border: 3px solid #fff;
    background: linear-gradient(#fff, #fff3f7);
    box-shadow: 0 6px 0 #f6b8ca, 0 12px 24px rgba(224, 104, 143, .25);
    transition: transform .15s ease, box-shadow .15s ease;
    animation: popIn .3s ease backwards;
  }
  .choice:nth-child(2) { animation-delay: .06s; } .choice:nth-child(3) { animation-delay: .12s; }
  .choice::before { content: '♡ '; color: var(--pink); }
  .choice:hover { transform: translateY(-2px); }
  .choice:hover::before { content: '♥ '; }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 #f6b8ca; }
  @keyframes popIn { from { opacity: 0; transform: scale(.9) translateY(10px); } }

  /* ---------- HUD ---------- */
  #hud { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; display: flex; gap: 8px; z-index: 7; }
  .hbtn {
    font-family: 'Jua'; font-size: 15px; padding: 8px 15px;
    border-radius: 999px; border: 2px solid #fff;
    background: rgba(255, 255, 255, .88); color: var(--pink-d);
    box-shadow: 0 3px 0 #f6c3d1;
  }
  .hbtn.on { background: var(--pink); color: #fff; }

  /* ---------- screens & cards ---------- */
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .overlay { background: rgba(255, 228, 236, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .card {
    background: var(--cream); border: 4px solid #fff; border-radius: 30px;
    box-shadow: 0 18px 50px rgba(224, 104, 143, .28), 0 0 0 3px #ffd3df;
    padding: 28px; width: min(480px, 100%);
    max-height: calc(100dvh - 32px); overflow: auto;
    animation: popIn .35s ease;
  }
  .btn {
    font-family: 'Jua'; font-size: 20px; color: #fff;
    padding: 14px 28px; border-radius: 999px; border: 3px solid #fff;
    background: linear-gradient(#f9a3c0, var(--pink-d));
    box-shadow: 0 6px 0 #c9557c, 0 12px 24px rgba(224, 104, 143, .3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9557c; }
  .btn.sub { background: #fff; color: var(--pink-d); box-shadow: 0 6px 0 #f6c3d1, 0 12px 24px rgba(224, 104, 143, .18); border-color: #ffd3df; }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* title */
  #titleScr { background: radial-gradient(circle at 50% 30%, #fffaf5 0%, #ffe4ec 55%, #ffd1df 100%); flex-direction: column; text-align: center; }
  #titleScr::before {
    content: ''; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(#fff 2px, transparent 2.5px);
    background-size: 34px 34px;
  }
  .title-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ribbon {
    font-family: 'Jua'; font-size: 15px; color: #fff; letter-spacing: .08em;
    background: var(--pink); padding: 6px 18px; border-radius: 999px;
    box-shadow: 0 4px 0 #e47a9c;
  }
  .title-wrap h1 {
    font-family: 'Jua'; font-weight: 400; line-height: 1.05;
    font-size: clamp(44px, 9vw, 84px); color: var(--pink-d);
    text-shadow: 0 4px 0 #fff, 4px 0 0 #fff, -4px 0 0 #fff, 0 -4px 0 #fff, 0 10px 22px rgba(224, 104, 143, .35);
  }
  .title-wrap h1 span { color: #c9557c; }
  .sub-title { color: var(--ink-soft); font-size: clamp(14px, 2vw, 17px); }
  .title-cake { width: clamp(170px, 30vw, 240px); animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-2deg); } }
  .badges { display: flex; gap: 8px; justify-content: center; align-items: center; color: var(--ink-soft); font-size: 14px; }
  .badge { font-size: 22px; filter: grayscale(1); opacity: .35; }
  .badge.got { filter: none; opacity: 1; }
  .note { color: #b8949c; font-size: 13px; }

  /* name */
  .name-card { text-align: center; display: flex; flex-direction: column; gap: 16px; }
  .name-card h2 { font-family: 'Jua'; font-weight: 400; font-size: 26px; color: var(--pink-d); }
  .name-card p { color: var(--ink-soft); line-height: 1.6; }
  #nameInput {
    font-family: 'Jua'; font-size: 24px; text-align: center; color: var(--ink);
    padding: 12px 16px; border-radius: 18px; border: 3px solid #ffc7d6; background: #fff; outline: none;
    user-select: text;
  }
  #nameInput:focus { border-color: var(--pink); box-shadow: 0 0 0 4px #ffe0e9; }

  /* log */
  .log-card { width: min(640px, 100%); }
  .log-card h2 { font-family: 'Jua'; font-weight: 400; color: var(--pink-d); margin-bottom: 14px; }
  #logList { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .log-item { line-height: 1.6; white-space: pre-wrap; word-break: keep-all; }
  .log-item b { font-family: 'Jua'; font-weight: 400; margin-right: 6px; }
  .log-item.narr { color: var(--ink-soft); }
  .log-item.me { color: #8c74c9; }

  /* cake */
  .cake-card { width: min(900px, 100%); display: grid; grid-template-columns: 1fr 1.1fr; gap: 22px; }
  .cake-card h2 { grid-column: 1 / -1; font-family: 'Jua'; font-weight: 400; font-size: 26px; color: var(--pink-d); text-align: center; }
  .preview {
    background: radial-gradient(circle at 50% 45%, #fff 0%, #ffeef3 75%);
    border-radius: 22px; border: 3px dashed #ffd3df;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; gap: 6px;
  }
  .preview svg { width: 100%; max-width: 340px; }
  .preview svg.pop { animation: hop .35s ease; }
  #cakeLabel { font-family: 'Jua'; color: var(--ink-soft); text-align: center; min-height: 1.4em; }
  .opt-group h3 { font-family: 'Jua'; font-weight: 400; font-size: 18px; color: var(--pink-d); margin: 4px 0 8px; }
  .opt-group + .opt-group { margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 15px 9px 10px; border-radius: 999px;
    border: 2px solid #f6d0dc; background: #fff;
    font-weight: 700; font-size: 15px; color: var(--ink);
    transition: transform .12s ease;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip.on { border-color: var(--pink); background: var(--pink-l); box-shadow: 0 0 0 3px #ffd6e2; }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, .08); flex: none; }
  .chip svg { width: 22px; height: 22px; flex: none; }
  .tip { font-size: 14px; line-height: 1.6; color: var(--ink-soft); background: #fff3f6; border-radius: 14px; padding: 10px 14px; margin: 16px 0; }
  @media (max-width: 720px) {
    .cake-card { grid-template-columns: 1fr; gap: 14px; padding: 20px; }
    .preview svg { max-width: 240px; }
  }

  /* ending */
  .end-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .end-emoji { font-size: 64px; animation: float 3s ease-in-out infinite; }
  .end-card h2 { font-family: 'Jua'; font-weight: 400; font-size: clamp(28px, 5vw, 36px); color: var(--pink-d); }
  .end-card p { line-height: 1.7; white-space: pre-wrap; word-break: keep-all; }
  .end-stats { color: var(--ink-soft); font-size: 14px; }

  /* pops & petals */
  #pops { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  .pop {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    font-family: 'Jua'; font-size: 22px; padding: 6px 16px; border-radius: 999px;
    background: #fff; box-shadow: 0 6px 18px rgba(224, 104, 143, .25);
    animation: popUp 1.6s ease forwards;
  }
  @keyframes popUp {
    0% { opacity: 0; transform: translate(-50%, 20px) scale(.8); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    75% { opacity: 1; transform: translate(-50%, -10px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -30px); }
  }
  #petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 25; }
  .petal {
    position: absolute; top: -20px; width: 13px; height: 9px;
    background: #ffc1d3; border-radius: 100% 0 100% 0; opacity: .8;
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(600deg); } }

  @media (max-width: 600px) {
    #box { min-height: 130px; padding: 26px 20px 22px; }
    #nameTag { font-size: 17px; left: 18px; }
    .pos-left { left: 26%; } .pos-right { left: 74%; }
    #choices { bottom: 170px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="clickLayer"></div>
  <div id="chars"></div>

  <div id="box" hidden>
    <div id="nameTag" hidden></div>
    <div id="text"></div>
    <div id="next" hidden>▼</div>
  </div>
  <div id="choices" hidden></div>

  <div id="hud" hidden>
    <button class="hbtn" id="logBtn">기록</button>
    <button class="hbtn" id="autoBtn">자동</button>
    <button class="hbtn" id="titleBtn">타이틀</button>
  </div>

  <!-- title -->
  <div id="titleScr" class="screen">
    <div class="title-wrap">
      <div class="ribbon">팬메이드 비주얼 노벨</div>
      <h1>향기로운<br><span>케이크 가게</span></h1>
      <p class="sub-title">― 「향기로운 꽃은 늠름하게 핀다」 팬 에피소드 ―</p>
      <div class="title-cake" id="titleCake"></div>
      <div class="btns">
        <button class="btn" id="startBtn">시작하기</button>
        <button class="btn sub" id="continueBtn">이어하기</button>
      </div>
      <div class="badges" id="titleBadges"></div>
      <p class="note">비공식 팬 작품 · 초안 v0.1</p>
    </div>
  </div>

  <!-- name -->
  <div id="nameScr" class="screen overlay" hidden>
    <div class="card name-card">
      <h2>처음 뵙겠습니다! 🍓</h2>
      <p>오늘부터 케이크 가게에서<br>아르바이트를 하게 된 당신의 이름은?</p>
      <input id="nameInput" maxlength="8" placeholder="하나" autocomplete="off">
      <div class="btns"><button class="btn" id="nameOk">결정!</button></div>
    </div>
  </div>

  <!-- cake -->
  <div id="cakeScr" class="screen overlay" hidden>
    <div class="card cake-card">
      <h2>🎂 첫 케이크 만들기</h2>
      <div class="preview">
        <div id="cakePreview"></div>
        <div id="cakeLabel"></div>
      </div>
      <div>
        <div id="cakeOpts"></div>
        <div class="tip">💡 린타로: “와구리 씨가 좋아하는 걸 떠올려 봐.”</div>
        <div class="btns"><button class="btn" id="cakeDone" disabled>완성!</button></div>
      </div>
    </div>
  </div>

  <!-- log -->
  <div id="logScr" class="screen overlay" hidden>
    <div class="card log-card">
      <h2>📖 대화 기록</h2>
      <div id="logList"></div>
      <div class="btns"><button class="btn sub" id="logClose">닫기</button></div>
    </div>
  </div>

  <!-- ending -->
  <div id="endScr" class="screen overlay" hidden>
    <div class="card end-card">
      <div class="ribbon">ENDING</div>
      <div class="end-emoji" id="endEmoji"></div>
      <h2 id="endTitle"></h2>
      <p id="endDesc"></p>
      <div class="end-stats" id="endStats"></div>
      <div class="badges" id="endBadges"></div>
      <div class="btns">
        <button class="btn" id="againBtn">처음부터 다시</button>
        <button class="btn sub" id="endTitleBtn">타이틀로</button>
      </div>
    </div>
  </div>

  <div id="pops"></div>
  <div id="petals"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const SAVE_KEY = 'kaoru-vn-save';
const END_KEY = 'kaoru-vn-endings';

/* =========================================================
   Characters (placeholder chibi SVGs — swap for real art later)
   ========================================================= */
const DARK = '#3b2a33';

function eyes(e, o) {
  const Y = 120;
  if (e === 'smile' || e === 'happy') {
    return [78, 122].map(x =>
      `<path d="M${x - 10} ${Y + 2} Q${x} ${Y - 10} ${x + 10} ${Y + 2}" fill="none" stroke="${DARK}" stroke-width="4" stroke-linecap="round"/>`).join('');
  }
  const big = e === 'surprised';
  const rx = o.sharp ? (big ? 7 : 6) : (big ? 9 : 8);
  const ry = o.sharp ? (big ? 8.5 : 6.5) : (big ? 11.5 : 10.5);
  return [78, 122].map(x => `
    <ellipse cx="${x}" cy="${Y}" rx="${rx}" ry="${ry}" fill="${o.iris}"/>
    <ellipse cx="${x}" cy="${Y + 1.5}" rx="${rx * .55}" ry="${ry * .6}" fill="${DARK}"/>
    <circle cx="${x - rx * .35}" cy="${Y - ry * .4}" r="${rx * .4}" fill="#fff"/>
    <circle cx="${x + rx * .4}" cy="${Y + ry * .35}" r="${rx * .18}" fill="#fff"/>
    <path d="M${x - rx - 3} ${Y - ry + (o.sharp ? 3 : 1)} Q${x} ${Y - ry - (o.sharp ? 2 : 4)} ${x + rx + 3} ${Y - ry + (o.sharp ? 3 : 1)}" fill="none" stroke="${DARK}" stroke-width="${o.sharp ? 4 : 3.5}" stroke-linecap="round"/>`).join('');
}

function brows(e, o) {
  let l, r;
  if (e === 'surprised' || e === 'happy') { l = 'M66 95 Q77 89 88 94'; r = 'M112 94 Q123 89 134 95'; }
  else if (e === 'blush' || e === 'troubled') { l = 'M66 103 Q77 99 88 96'; r = 'M112 96 Q123 99 134 103'; }
  else if (o.sharp) { l = 'M65 99 Q77 101 89 106'; r = 'M111 106 Q123 101 135 99'; }
  else { l = 'M67 100 Q77 96 88 99'; r = 'M112 99 Q123 96 133 100'; }
  return [l, r].map(d => `<path d="${d}" fill="none" stroke="${o.brow}" stroke-width="3.5" stroke-linecap="round"/>`).join('');
}

function mouth(e, o) {
  const line = d => `<path d="${d}" fill="none" stroke="${DARK}" stroke-width="3" stroke-linecap="round"/>`;
  switch (e) {
    case 'smile': return `<path d="M90 140 Q100 155 110 140 Z" fill="#d9607a"/>`;
    case 'happy': return `<path d="M86 139 Q100 160 114 139 Z" fill="#d9607a"/><path d="M93 149 Q100 154 107 149 Q100 146 93 149" fill="#ff9fb0"/>`;
    case 'surprised': return `<ellipse cx="100" cy="147" rx="5.5" ry="7" fill="#d9607a"/>`;
    case 'blush': return line('M91 146 Q95.5 142 100 146 Q104.5 150 109 146');
    case 'troubled': return line('M93 148 Q100 143 107 148');
    default: return o.sharp ? line('M93 146 L107 146') : line('M93 143 Q100 149 107 143');
  }
}

function face(e, o) {
  const strong = e === 'blush' || e === 'happy';
  const op = strong ? .75 : (o.sharp ? 0 : .35);
  let s = brows(e, o) + eyes(e, o) + mouth(e, o);
  s += `<path d="M100 130 l-2 4" stroke="#e6b3a3" stroke-width="2" stroke-linecap="round"/>`;
  s += [70, 130].map(x => `<ellipse cx="${x}" cy="137" rx="11" ry="6" fill="#ff8fab" opacity="${op}"/>`).join('');
  if (e === 'blush') s += [64, 124].map(x => `<path d="M${x} 134 l4 -5 M${x + 6} 134 l4 -5 M${x + 12} 134 l4 -5" stroke="#f26b8f" stroke-width="2" stroke-linecap="round"/>`).join('');
  if (e === 'troubled') s += `<path d="M152 86 Q159 98 152 103 Q145 98 152 86 Z" fill="#9fd6f5"/>`;
  if (e === 'happy') s += sparkle(166, 70, 9) + sparkle(30, 92, 6) + sparkle(176, 108, 5);
  if (e === 'surprised') s += `<path d="M168 62 l6 -12 M178 72 l12 -6 M172 68 l10 -10" stroke="${o.accent}" stroke-width="3" stroke-linecap="round"/>`;
  return s;
}

function sparkle(x, y, r) {
  return `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="#ffd36e"/>`;
}

function drawRin(e) {
  const hair = '#f2cf6b', hairS = '#ddb04c', skin = '#ffe3d3';
  return `<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M38 112 Q34 36 100 34 Q166 36 162 112 Z" fill="${hairS}"/>
    <rect x="88" y="158" width="24" height="36" rx="8" fill="#f7d1c1"/>
    <path d="M34 300 Q36 204 100 188 Q164 204 166 300 Z" fill="#fdfcfc" stroke="#ebe1e1" stroke-width="2"/>
    <path d="M86 188 L100 212 L92 216 L76 196 Z M114 188 L100 212 L108 216 L124 196 Z" fill="#fff" stroke="#e3d8d8" stroke-width="2"/>
    <path d="M70 232 L86 194 M130 232 L114 194" stroke="#e59f8e" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 300 L64 230 Q100 220 136 230 L140 300 Z" fill="#f2b8a8"/>

function starPath(R, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1);
  }
  return d + 'Z';
}

function topping(id, x, y, i = 0) {
  const g = s => `<g transform="translate(${x} ${y})">${s}</g>`;
  switch (id) {
    case 'strawberry': return g(`
      <path d="M-12 -6 Q-12 -14 0 -14 Q12 -14 12 -6 Q10 6 0 14 Q-10 6 -12 -6 Z" fill="#ef4f6c"/>
      <path d="M-8 -13 L-2 -9 L0 -15 L2 -9 L8 -13 L4 -16 L0 -14 L-4 -16 Z" fill="#6cbf6a"/>
      <circle cx="-5" cy="-3" r="1.2" fill="#ffe3a0"/><circle cx="4" cy="-1" r="1.2" fill="#ffe3a0"/><circle cx="-1" cy="5" r="1.2" fill="#ffe3a0"/>
      <ellipse cx="-6" cy="-8" rx="3" ry="2" fill="#fff" opacity=".5"/>`);
    case 'blueberry': return g(`
      <circle cx="-7" cy="2" r="7" fill="#4f5fae"/><circle cx="7" cy="2" r="7" fill="#5a6cc0"/><circle cx="0" cy="-7" r="7" fill="#4a58a3"/>
      <circle cx="-2" cy="-10" r="2" fill="#fff" opacity=".6"/><circle cx="5" cy="-1" r="2" fill="#fff" opacity=".5"/>`);
    case 'macaron': {
      const c = ['#ffb3c8', '#c9b6f0', '#bfe6c8'][i % 3];
      return g(`<ellipse cy="-5" rx="13" ry="5.5" fill="${c}"/><rect x="-12" y="-4" width="24" height="4.5" rx="2" fill="#fff6e8"/><ellipse cy="3" rx="13" ry="5.5" fill="${c}"/>`);
    }
    case 'chocolate': return g(`<g transform="rotate(${i % 2 ? 14 : -14})">
      <rect x="-14" y="-10" width="28" height="19" rx="3" fill="#6b3f2e"/>
      <rect x="-11" y="-7" width="10" height="6" rx="1.5" fill="#85503b"/><rect x="1" y="-7" width="10" height="6" rx="1.5" fill="#85503b"/>
      <rect x="-11" y="1" width="10" height="5" rx="1.5" fill="#85503b"/><rect x="1" y="1" width="10" height="5" rx="1.5" fill="#85503b"/></g>`);
  }
  return '';
}

function cakeSVG(c) {
  const b = c.base && pick('base', c.base), cr = c.cream && pick('cream', c.cream), t = c.top;
  let s = `<svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="150" cy="222" rx="125" ry="24" fill="#fff" stroke="#f6c6d4" stroke-width="4"/>
    <ellipse cx="150" cy="220" rx="100" ry="16" fill="none" stroke="#fde3ea" stroke-width="3"/>`;
  if (!b) {
    s += `<path d="M60 100 V200 A90 18 0 0 0 240 200 V100" fill="none" stroke="#f2a7bd" stroke-width="3" stroke-dasharray="8 8"/>
          <ellipse cx="150" cy="100" rx="90" ry="18" fill="none" stroke="#f2a7bd" stroke-width="3" stroke-dasharray="8 8"/>
          <text x="150" y="168" text-anchor="middle" font-family="Jua, sans-serif" font-size="44" fill="#f2a7bd">?</text>`;
    return s + '</svg>';
  }
  const edge = x => 100 + 18 * Math.sqrt(Math.max(0, 1 - ((x - 150) / 90) ** 2));
  s += `<path d="M60 100 V200 A90 18 0 0 0 240 200 V100 Z" fill="${b.color}" stroke="rgba(122,82,70,.22)" stroke-width="2"/>
        <path d="M70 108 V196" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".25"/>`;
  const mid = cr ? cr.color : 'rgba(255,255,255,.45)';
  s += `<path d="M60 146 A90 18 0 0 0 240 146 V160 A90 18 0 0 1 60 160 Z" fill="${mid}"/>`;
  if (cr) {
    s += `<ellipse cx="150" cy="100" rx="90" ry="18" fill="${cr.color}" stroke="rgba(122,82,70,.15)" stroke-width="2"/>`;
    [18, 28, 14, 24, 32, 16, 26, 20, 14].forEach((h, i) => {
      const x = 68 + i * 20;
      s += `<rect x="${x - 7}" y="${edge(x) - 8}" width="15" height="${h}" rx="7.5" fill="${cr.color}"/>`;
    });
  } else {
    s += `<ellipse cx="150" cy="100" rx="90" ry="18" fill="${b.color}" stroke="rgba(122,82,70,.22)" stroke-width="2"/>
          <ellipse cx="150" cy="100" rx="70" ry="12" fill="#fff" opacity=".18"/>`;
  }
  if (t) [[112, 94], [150, 88], [188, 94], [130, 106], [170, 106]].forEach(([x, y], i) => { s += topping(t, x, y, i); });
  return s + '</svg>';
}

function cakeName() {
  const c = S.cake;
  if (!c.base || !c.cream || !c.top) return '케이크';
  return `${pick('base', c.base).name} 시트에 ${pick('cream', c.cream).name}을 바르고 ${pick('top', c.top).obj} 올린 케이크`;
}

function renderCakeUI(popped) {
  const prev = $('#cakePreview');
  prev.innerHTML = cakeSVG(S.cake);
  if (popped) prev.firstChild.classList.add('pop');
  const c = S.cake;
  $('#cakeLabel').textContent = [c.base && pick('base', c.base).name + ' 시트', c.cream && pick('cream', c.cream).name, c.top && pick('top', c.top).name].filter(Boolean).join(' + ') || '재료를 골라 주세요';
  $('#cakeOpts').innerHTML = Object.entries(CAKE).map(([k, g]) => `
    <div class="opt-group"><h3>${g.label}</h3><div class="chips">
      ${g.items.map(it => `<button class="chip ${c[k] === it.id ? 'on' : ''}" data-k="${k}" data-id="${it.id}">
        ${k === 'top' ? `<svg viewBox="-16 -16 32 32">${topping(it.id, 0, 0)}</svg>` : `<span class="sw" style="background:${it.color}"></span>`}
        ${it.name}</button>`).join('')}
    </div></div>`).join('');
  $('#cakeDone').disabled = !(c.base && c.cream && c.top);
}

$('#cakeOpts').addEventListener('click', ev => {
  const b = ev.target.closest('.chip');
  if (!b) return;
  S.cake[b.dataset.k] = b.dataset.id;
  renderCakeUI(true);
});
$('#cakeDone').addEventListener('click', () => {
  S.cakeScore = Object.keys(FAV).filter(k => S.cake[k] === FAV[k]).length;
  $('#cakeScr').hidden = true;
  $('#box').hidden = false;
  S.i++; run();
});

/* =========================================================
   Engine
   ========================================================= */
const fresh = () => ({ i: 0, name: '하나', k: 0, r: 0, cake: {}, cakeScore: 0, bg: null, chars: {}, log: [] });
let S = fresh();
let playing = false, auto = false, typing = null, fullText = '', autoTimer = null, curBg = null;

const sub = t => t.replace(/\{name\}/g, S.name).replace(/\{cakeName\}/g, cakeName());

function setBg(name) {
  if (name === curBg) return;
  curBg = name;
  const el = $('#bg');
  el.classList.add('fade');
  setTimeout(() => { el.innerHTML = BGS[name](); el.classList.remove('fade'); }, 350);
}

function renderChars() {
  const layer = $('#chars');
  for (const el of [...layer.children]) {
    if (!S.chars[el.dataset.id] && !el.classList.contains('out')) {
      el.classList.add('out');
      setTimeout(() => el.remove(), 360);
    }
  }
  for (const [id, c] of Object.entries(S.chars)) {
    let el = layer.querySelector(`[data-id="${id}"]:not(.out)`);
    if (!el) {
      el = document.createElement('div');
      el.className = `char ${id} enter`;
      el.dataset.id = id;
      layer.appendChild(el);
    }
    el.classList.remove('pos-left', 'pos-center', 'pos-right');
    el.classList.add('pos-' + c.p);
    if (el.dataset.e !== c.e) {
      const had = !!el.dataset.e;
      el.innerHTML = CHARS[id].draw(c.e);
      el.dataset.e = c.e;
      if (had) { el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
    }
  }
}

function setSpeaker(who) {
  const tag = $('#nameTag');
  if (who) {
    tag.hidden = false;
    tag.textContent = CHARS[who].name;
    tag.style.background = CHARS[who].color;
  } else tag.hidden = true;
  $('#text').classList.toggle('narr', !who);
  for (const el of $('#chars').children) el.classList.toggle('dim', !!who && el.dataset.id !== who);
}

function typeText(t) {
  fullText = t;
  let n = 0;
  const el = $('#text');
  el.textContent = '';
  $('#next').hidden = true;
  clearInterval(typing);
  typing = setInterval(() => {
    n++;
    el.textContent = fullText.slice(0, n);
    if (n >= fullText.length) finishType();
  }, 28);
}

function finishType() {
  clearInterval(typing);
  typing = null;
  $('#text').textContent = fullText;
  $('#next').hidden = false;
  if (auto) autoTimer = setTimeout(advance, 1300 + fullText.length * 25);
}

function say(st) {
  if (st.who && S.chars[st.who] && st.e) { S.chars[st.who].e = st.e; renderChars(); }
  setSpeaker(st.who);
  const t = sub(st.t);
  S.log.push({ who: st.who, t });
  if (S.log.length > 80) S.log.shift();
  typeText(t);
}

function choose(st) {
  if (st.prompt) { setSpeaker(null); typeText(st.prompt); }
  $('#next').hidden = true;
  const box = $('#choices');
  box.innerHTML = '';
  st.choice.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = sub(o.t);
    b.onclick = ev => {
      ev.stopPropagation();
      box.hidden = true;
      S.log.push({ who: 'me', t: sub(o.t) });
      addPts(o.k || 0, o.r || 0);
      S.i = o.go ? LABELS[o.go] : S.i + 1;
      run();
    };
    box.appendChild(b);
  });
  box.hidden = false;
}

function addPts(k, r) {
  S.k += k; S.r += r;
  const pops = [];
  if (k) pops.push([`💗 카오루코 +${k}`, CHARS.kao.color]);
  if (r) pops.push([`⭐ 린타로 +${r}`, CHARS.rin.color]);
  pops.forEach(([txt, col], i) => setTimeout(() => {
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = txt;
    p.style.color = col;
    $('#pops').appendChild(p);
    setTimeout(() => p.remove(), 1700);
  }, i * 380));
}

function save() {
  store.set(SAVE_KEY, { i: S.i, name: S.name, k: S.k, r: S.r, cake: S.cake, cakeScore: S.cakeScore, bg: S.bg, chars: S.chars, log: S.log.slice(-40) });
}

function run() {
  clearTimeout(autoTimer);
  while (S.i < SCRIPT.length) {
    const st = SCRIPT[S.i];
    if ('label' in st) { S.i++; continue; }
    if (st.bg) { S.bg = st.bg; setBg(st.bg); S.i++; continue; }
    if (st.show) {
      for (const [id, [e, p]] of Object.entries(st.show)) S.chars[id] = { e, p };
      renderChars(); S.i++; continue;
    }
    if (st.hide) { S.chars = {}; renderChars(); S.i++; continue; }
    if (st.pts) { addPts(...st.pts); S.i++; continue; }
    if (st.go) { S.i = LABELS[st.go]; continue; }
    if (st.branch) { S.i = LABELS[st.branch(S)]; continue; }
    save();
    if ('t' in st) return say(st);
    if (st.choice) return choose(st);
    if (st.cake) return openCake();
    if (st.ending) return showEnding(st.ending);
    S.i++;
  }
}

function busy() {
  return !playing || !$('#choices').hidden || !$('#cakeScr').hidden || !$('#logScr').hidden || !$('#endScr').hidden || !$('#nameScr').hidden;
}

function advance() {
  if (busy()) return;
  clearTimeout(autoTimer);
  if (typing) return finishType();
  S.i++;
  run();
}

function openCake() {
  $('#box').hidden = true;
  setSpeaker(null);
  renderCakeUI();
  $('#cakeScr').hidden = false;
}

function endings() { return store.get(END_KEY) || []; }

function badgesHTML() {
  const got = endings();
  return Object.entries(ENDINGS).map(([id, e]) => `<span class="badge ${got.includes(id) ? 'got' : ''}" title="${got.includes(id) ? e.title : '???'}">${e.emoji}</span>`).join('')
    + `<span>엔딩 ${got.length}/3</span>`;
}

function showEnding(id) {
  const e = ENDINGS[id];
  const got = endings();
  if (!got.includes(id)) { got.push(id); store.set(END_KEY, got); }
  store.del(SAVE_KEY);
  $('#endEmoji').textContent = e.emoji;
  $('#endTitle').textContent = e.title;
  $('#endDesc').textContent = e.desc;
  $('#endStats').textContent = `💗 카오루코 ${S.k} · ⭐ 린타로 ${S.r}`;
  $('#endBadges').innerHTML = badgesHTML();
  $('#box').hidden = true;
  $('#endScr').hidden = false;
}

function enterGame() {
  playing = true;
  ['#titleScr', '#nameScr', '#endScr', '#cakeScr', '#logScr', '#choices'].forEach(s => $(s).hidden = true);
  $('#box').hidden = false;
  $('#hud').hidden = false;
  $('#text').textContent = '';
}

function newGame(name) {
  S = fresh();
  S.name = name;
  curBg = null;
  $('#chars').innerHTML = '';
  enterGame();
  run();
}

function continueGame() {
  const sv = store.get(SAVE_KEY);
  if (!sv) return;
  S = Object.assign(fresh(), sv);
  curBg = null;
  $('#chars').innerHTML = '';
  enterGame();
  if (S.bg) setBg(S.bg);
  renderChars();
  run();
}

function toTitle() {
  playing = false;
  clearInterval(typing); typing = null;
  clearTimeout(autoTimer);
  ['#box', '#hud', '#choices', '#cakeScr', '#logScr', '#endScr', '#nameScr'].forEach(s => $(s).hidden = true);
  $('#titleScr').hidden = false;
  $('#continueBtn').disabled = !store.get(SAVE_KEY);
  $('#titleBadges').innerHTML = badgesHTML();
}

/* ---------- wiring ---------- */
$('#box').addEventListener('click', advance);
$('#clickLayer').addEventListener('click', advance);
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); advance(); }
});

$('#startBtn').onclick = () => { $('#nameScr').hidden = false; $('#nameInput').value = ''; setTimeout(() => $('#nameInput').focus(), 50); };
$('#continueBtn').onclick = continueGame;
$('#nameOk').onclick = () => newGame($('#nameInput').value.trim() || '하나');
$('#nameInput').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('#nameOk').click(); });

$('#logBtn').onclick = ev => {
  ev.stopPropagation();
  $('#logList').innerHTML = '';
  S.log.forEach(l => {
    const d = document.createElement('div');
    d.className = 'log-item ' + (l.who === 'me' ? 'me' : l.who ? '' : 'narr');
    if (l.who) {
      const b = document.createElement('b');
      b.textContent = l.who === 'me' ? S.name : CHARS[l.who].name;
      if (l.who !== 'me') b.style.color = CHARS[l.who].color;
      d.appendChild(b);
    }
    d.appendChild(document.createTextNode(l.t));
    $('#logList').appendChild(d);
  });
  $('#logScr').hidden = false;
  const card = $('#logScr .card');
  card.scrollTop = card.scrollHeight;
};
$('#logClose').onclick = () => { $('#logScr').hidden = true; };
$('#autoBtn').onclick = ev => {
  ev.stopPropagation();
  auto = !auto;
  $('#autoBtn').classList.toggle('on', auto);
  if (auto && !typing && !busy()) autoTimer = setTimeout(advance, 800);
  if (!auto) clearTimeout(autoTimer);
};
$('#titleBtn').onclick = ev => { ev.stopPropagation(); toTitle(); };
$('#againBtn').onclick = () => newGame(S.name);
$('#endTitleBtn').onclick = toTitle;

/* ---------- decor ---------- */
$('#titleCake').innerHTML = cakeSVG(FAV);
for (let i = 0; i < 16; i++) {
  const p = document.createElement('span');
  p.className = 'petal';
  p.style.left = Math.random() * 100 + '%';
  p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
  p.style.animationDuration = (9 + Math.random() * 9) + 's';
  p.style.animationDelay = (-Math.random() * 18) + 's';
  if (i % 3 === 0) p.style.background = '#ffe0ea';
  if (i % 5 === 0) p.style.background = '#d8c8f5';
  $('#petals').appendChild(p);
}
toTitle();
</script>
</body>
</html>
